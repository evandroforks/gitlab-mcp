services:
  gitlab-mcp:
    image: ${GITLAB_MCP_IMAGE:?Set an immutable image digest in .env}
    pull_policy: never
    restart: unless-stopped
    init: true
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    ports:
      - 127.0.0.1:${GITLAB_MCP_PORT:-3002}:3002
    environment:
      HOST: 0.0.0.0
      PORT: "3002"
      STREAMABLE_HTTP: "true"
      REMOTE_AUTHORIZATION: "true"
      GITLAB_API_URL: ${GITLAB_API_URL:?Set the fixed GitLab API URL in .env}
      ENABLE_DYNAMIC_API_URL: "false"
      ENABLE_DYNAMIC_PROJECT_SCOPE: "false"
      GITLAB_ALLOW_UNAUTHENTICATED_TOOL_DISCOVERY: "false"
      GITLAB_DISABLE_VERSION_CHECK: "true"
      SESSION_TIMEOUT_SECONDS: ${SESSION_TIMEOUT_SECONDS:-3600}
      MAX_SESSIONS: "256"
      MAX_REQUESTS_PER_MINUTE: "120"
    mem_limit: 512m
    memswap_limit: 2g
    pids_limit: 64
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3002/health',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
